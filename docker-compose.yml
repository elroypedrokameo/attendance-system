services:
  mysql:
    image: mysql:8.4
    container_name: attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employee_db}
      MYSQL_USER: ${MYSQL_USER:-dexa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - attendance-network

  employee-service:
    build:
      context: ./backend/employee-service
      dockerfile: Dockerfile
    container_name: attendance-employee-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-dexa_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${EMPLOYEE_DB_NAME:-employee_db}
      PORT_EMPLOYEE_SERVICE: 3001
      HOST_EMPLOYEE_SERVICE: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - attendance-network

  attendance-service:
    build:
      context: ./backend/attendance-service
      dockerfile: Dockerfile
    container_name: attendance-attendance-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-dexa_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${ATTENDANCE_DB_NAME:-attendance_db}
      PORT_ATTENDANCE_SERVICE: 3002
      HOST_ATTENDANCE_SERVICE: 0.0.0.0
      WORK_START_TIME: ${WORK_START_TIME:-09:15}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - attendance-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: attendance-api-gateway
    restart: unless-stopped
    environment:
      PORT_API_GATEWAY: 3000
      EMPLOYEE_SERVICE_HOST: employee-service
      PORT_EMPLOYEE_SERVICE: 3001
      ATTENDANCE_SERVICE_HOST: attendance-service
      PORT_ATTENDANCE_SERVICE: 3002
      JWT_SECRET: ${JWT_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "3000:3000"
    depends_on:
      - employee-service
      - attendance-service
    networks:
      - attendance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge

volumes:
  mysql_data:
